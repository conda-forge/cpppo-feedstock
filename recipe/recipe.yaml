schema_version: 1

context:
  name: cpppo
  version: "5.8.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cpppo-${{ version }}.tar.gz
  sha256: 25f9714457de30475f3ba2d72b25b4a88e0bd4ab9ff729178b8c4cdf3e70ac38

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - enip_server = cpppo.server.enip.main:main
      - enip_client = cpppo.server.enip.client:main
      - enip_get_attribute = cpppo.server.enip.get_attribute:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - greenery >=2.0,<3.0

tests:
  - python:
      imports:
        - cpppo
        - cpppo.server
        - cpppo.server.enip
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - enip_server --help
      - enip_client --help
      - enip_get_attribute --help

about:
  summary: Cpppo is a Communication Protocol Python Parser and Originator
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - COPYING
  homepage: https://github.com/pjkundert/cpppo

extra:
  recipe-maintainers:
    - beenje
